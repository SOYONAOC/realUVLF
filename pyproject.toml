[build-system]
requires = ["setuptools==82.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auroralf"
version = "2.0.0"
description = "Deterministic, provenance-complete high-redshift UV luminosity-function research pipeline"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "astropy==7.2.0",
  "h5py==3.16.0",
  "hmf==3.6.0",
  "numpy==2.4.2",
  "scipy==1.17.1",
]

[dependency-groups]
analysis = [
  "certifi==2026.2.25",
  "colossus==1.3.17",
  "massfunc==0.2.2",
  "matplotlib==3.10.8",
  "psutil==7.2.2",
  "requests==2.32.5",
]
test = [
  "pytest==9.0.2",
  "ruff==0.15.7",
]
slides = [
  "matplotlib==3.10.8",
]

[tool.setuptools.packages.find]
include = ["auroralf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
# Adopt formatting incrementally for maintained experiment workflows.
include = [
  "auroralf/experiments/*.py",
  "scripts/experiments/random_q_burst.py",
  "scripts/run/run_random_q_burst.py",
  "scripts/submit/submit_random_q.py",
  "scripts/submit/submit_random_q_fat2.py",
  "scripts/analysis/visbal_duty_uvlf.py",
  "scripts/analysis/combine_visbal_batches.py",
  "scripts/analysis/analyze_random_q.py",
  "scripts/analysis/analyze_random_q_heii.py",
  "scripts/analysis/compare_random_q_heii_observations.py",
  "scripts/analysis/merge_random_q_shards.py",
  "tests/test_experiment_workflows.py",
  "tests/test_random_q_heii.py",
  "tests/test_heii_observation_comparison.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# BLAS thread limits must be applied before importing NumPy in spawned workers.
"scripts/run/run_random_q_burst.py" = ["E402"]
